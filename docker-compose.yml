services:
  # ── OmniRoute (roteador de LLMs, API OpenAI-compatível) ───────────
  # Usa a imagem oficial já buildada do GHCR para evitar build local
  omniroute:
    image: diegosouzapw/omniroute:3.8.49
    container_name: omniroute
    restart: unless-stopped
    ports:
      - "${PORT:-20128}:20128"
      - "${API_PORT:-20129}:20129"
      - "${LIVE_WS_PORT:-20132}:20132"
    environment:
      - DATA_DIR=/app/data
      - OMNIROUTE_BASE_PATH=${OMNIROUTE_BASE_PATH:-}
      - PORT=20128
      - DASHBOARD_PORT=20128
      - API_PORT=20129
      - API_HOST=0.0.0.0
      - LIVE_WS_PORT=20132
      - LIVE_WS_HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/omniroute:/app/data
    depends_on:
      - redis

  # ── Redis (obrigatório pelo OmniRoute) ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - redis-data:/data

  # ── Qdrant (memória vetorial, usada pelo OmniRoute) ───────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - qdrant-data:/qdrant/storage

  # ── Akita AI Memory (memória de contexto + servidor MCP) ─────────
  akita-ai-memory:
    image: akitaonrails/ai-memory:latest
    container_name: akita-ai-memory
    restart: unless-stopped
    ports:
      - "${AI_MEMORY_PORT:-49374}:49374"
    environment:
      - AI_MEMORY_AUTH_TOKEN=${AI_MEMORY_AUTH_TOKEN:-troque-por-um-token-secreto}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - akita-data:/data

  # ── Open Web UI (interface de chat no navegador) ──────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"  # Corrigido: Open Web UI roda na porta 8080 dentro do container
    environment:
      - OPENAI_API_BASE_URL=http://omniroute:20129/v1
      - OPENAI_API_KEY=dummy
      - ENABLE_OAUTH_SIGNUP=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - open-webui-data:/app/backend/data
    depends_on:
      - omniroute

  # ── OpenHands (agente autônomo de programação, isolado) ───────────
  openhands:
    image: ghcr.io/all-hands-ai/openhands:latest
    container_name: openhands
    restart: unless-stopped
    working_dir: /app
    # SÓ esta pasta é visível para o agente — ele não toca o resto do sistema
    ports:
      - "3001:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./projetos:/workspace:rw
      - openhands-deps:/home/openhands/.local
      - ./openhands-data:/.openhands
      - /usr/bin/docker:/usr/bin/docker:ro
    tmpfs:
      - /tmp
      - /var/lib/docker
      - /var/lib/apt/lists
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    environment:
      - LLM_API_BASE=http://omniroute:20129/v1
      - LLM_MODEL=gpt-4o-mini
      - LLM_API_KEY=dummy
      - SANDBOX_TYPE=docker
      # IMPORTANTE: em OpenHands 0.59.0 a imagem do runtime nao e lida via
      # variavel de ambiente. Ela deve ser definida em Settings
      # (sandbox_runtime_container_image). Ja foi definida via API para
      # ghcr.io/all-hands-ai/runtime:latest (imagem ja baixada) e persistida
      # em openhands-data/settings.json. Isso evita o build local do runtime
      # que travava em "Building Runtime..." (falha no apt-get update).
      - SANDBOX_RUNTIME_IMAGE=ghcr.io/all-hands-ai/runtime:latest
    depends_on:
      - omniroute

volumes:
  redis-data:
  qdrant-data:
  akita-data:
  open-webui-data:
  openhands-deps: