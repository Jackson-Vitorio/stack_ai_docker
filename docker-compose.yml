  # ── Open Web UI (interface de chat no navegador) ──────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-3000}:3000"
    environment:
      - OPENAI_API_BASE_URL=http://omniroute:20129/v1
      - OPENAI_API_KEY=dummy
      - ENABLE_OAUTH_SIGNUP=false
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - omniroute

  # ── OpenHands (agente autônomo de programação, isolado) ───────────
  openhands:
    image: docker.io/openhands/openhands:latest
    container_name: openhands
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /workspace
    # SÓ esta pasta é visível para o agente — ele não toca o resto do sistema
    volumes:
      - ./projetos:/workspace:rw
      - openhands-deps:/home/opendands/.local
    read_only: true
    tmpfs:
      - /tmp
      - /workspace
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    environment:
      - LLM_API_BASE=http://omniroute:20129/v1
      - LLM_MODEL=gpt-4o-mini
      - LLM_API_KEY=dummy
    depends_on:
      - omniroute