# docker-compose.yml
# Todos os segredos vêm do arquivo .env (mesma pasta deste arquivo).
# Nunca commite o .env. Use o .env.example como modelo.
#
# Mudanças de segurança em relação à versão anterior:
#  - /var/run/docker.sock removido de todos os serviços
#  - portas publicadas só em 127.0.0.1 (nada exposto à rede local)
#  - Redis com senha
#  - open-code enxerga só a pasta projetos (antes via a pasta inteira, incluindo o .env)
#  - chaves, tokens e senhas movidos para o .env

services:
  # ── OmniRoute (roteador de LLMs, API compatível com OpenAI) ───────
  omniroute:
    image: diegosouzapw/omniroute:3.8.49
    container_name: omniroute
    restart: unless-stopped
    ports:
      - "127.0.0.1:20128:20128"
      - "127.0.0.1:20129:20129"
      - "127.0.0.1:20132:20132"
    environment:
      DATA_DIR: /app/data
      OMNIROUTE_BASE_PATH: ""
      PORT: "20128"
      DASHBOARD_PORT: "20128"
      API_PORT: "20129"
      API_HOST: 0.0.0.0
      LIVE_WS_PORT: "20132"
      LIVE_WS_HOST: 0.0.0.0
      REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}@redis:6379
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?defina STORAGE_ENCRYPTION_KEY no .env}
    volumes:
      - ./data/omniroute:/app/data
    depends_on:
      - redis

  # ── Redis (obrigatório pelo OmniRoute) ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  # ── Qdrant (memória vetorial) ─────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  # ── Akita AI Memory (memória de contexto + servidor MCP) ──────────
  akita-ai-memory:
    image: akitaonrails/ai-memory:latest
    container_name: akita-ai-memory
    restart: unless-stopped
    ports:
      - "127.0.0.1:49374:49374"
    environment:
      AI_MEMORY_AUTH_TOKEN: ${AI_MEMORY_AUTH_TOKEN}
    volumes:
      - ./projetos:/workspace/projetos        # (mantenha o que já existe)
      - ./opencode.jsonc:/root/.config/opencode/opencode.jsonc

  # ── Open WebUI (chat no navegador) ────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://omniroute:20129/v1
      OPENAI_API_KEY: ${OMNIROUTE_API_KEY:?defina OMNIROUTE_API_KEY no .env}
      ENABLE_OAUTH_SIGNUP: "false"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?defina WEBUI_SECRET_KEY no .env}
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - omniroute

  # ── Open Code (agente com interface web) ──────────────────────────
  # Interface e API na mesma porta: http://localhost:3001
  # No diálogo "Abrir projeto", use /workspace/projetos
  open-code:
    image: ghcr.io/lehhair/opencodeui-backend:latest
    container_name: open-code
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:4096"
    environment:
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:?defina OMNIROUTE_API_KEY no .env}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:?defina OPENCODE_SERVER_USERNAME no .env}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?defina OPENCODE_SERVER_PASSWORD no .env}
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./projetos:/workspace/projetos
    depends_on:
      - omniroute

volumes:
  redis-data:
  qdrant-data:
  akita-data:
  open-webui-data: