# ──────────────────────────────────────────────────────────────────────
#  Stack IA — Tudo em uma pasta só
#  Serviços: OmniRoute + Redis + Qdrant + Akita AI Memory + Ollama +
#            Open Web UI + OpenHands (isolado na pasta ./projetos)
# ──────────────────────────────────────────────────────────────────────

services:
  # ── Redis (obrigatório pelo OmniRoute) ────────────────────────────
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── OmniRoute (build a partir do fonte clonado automaticamente) ────
  omniroute:
    build:
      context: .
      dockerfile: Dockerfile.omniroute
      target: runner
      args:
        OMNIROUTE_BRANCH: ${OMNIROUTE_BRANCH:-release/v3.8.49}
    container_name: omniroute
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - OMNIROUTE_BASE_PATH=${OMNIROUTE_BASE_PATH:-}
      - PORT=${PORT:-20128}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-20128}
      - API_PORT=${API_PORT:-20129}
      - API_HOST=0.0.0.0
      - LIVE_WS_PORT=${LIVE_WS_PORT:-20132}
      - LIVE_WS_HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
    ports:
      - "${DASHBOARD_PORT:-20128}:20128"
      - "${API_PORT:-20129}:20129"
      - "${LIVE_WS_PORT:-20132}:20132"
    volumes:
      - ./data/omniroute:/app/data
    depends_on:
      redis:
        condition: service_healthy

  # ── Qdrant (memória vetorial usada pelo OmniRoute) ─────────────────
  qdrant:
    image: docker.io/qdrant/qdrant:v1.12.4
    container_name: omniroute-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:6333/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Akita AI Memory (memória de contexto + servidor MCP) ──────────
  ai-memory:
    image: docker.io/akitaonrails/ai-memory:latest
    container_name: ai-memory
    restart: unless-stopped
    ports:
      - "${AI_MEMORY_PORT:-49374}:49374"
    environment:
      - AI_MEMORY_DATA_DIR=/data
      - AI_MEMORY_AUTH_TOKEN=${AI_MEMORY_AUTH_TOKEN}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_BASE=http://omniroute:20129/v1
      - LLM_MODEL=${LLM_MODEL:-qwen3:4b}
    volumes:
      - ./ai-memory-data:/data
    user: "1000:1000"
    depends_on:
      - omniroute

  # ── Ollama (modelos locais, Qwen 3.5 4B por padrão) ───────────────
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./ollama:/root/.ollama

  # ── Open Web UI (interface de chat no navegador) ──────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-3000}:3000"
    environment:
      - OPENAI_API_BASE_URL=http://omniroute:20129/v1
      - OPENAI_API_KEY=dummy
      - ENABLE_OAUTH_SIGNUP=false
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - omniroute

  # ── OpenHands (agente autônomo de programação, isolado) ───────────
  openhands:
    image: docker.io/openhands/openhands:latest
    container_name: openhands
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /workspace
    # SÓ esta pasta é visível para o agente — ele não toca o resto do sistema
    volumes:
      - ./projetos:/workspace:rw
      - openhands-deps:/home/opendands/.local
    read_only: true
    tmpfs:
      - /tmp
      - /workspace
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    environment:
      - LLM_API_BASE=http://omniroute:20129/v1
      - LLM_MODEL=${LLM_MODEL:-qwen3:4b}
      - LLM_API_KEY=dummy
    depends_on:
      - omniroute

volumes:
  redis-data:
    name: omniroute-redis-data
  qdrant-data:
    name: omniroute-qdrant-data
  open-webui-data:
    name: open-webui-data
  openhands-deps:
    name: openhands-deps